[project]
name = "onboarding-agent"
version = "0.1.0"
description = "POC de assistente de onboarding: agent com LangGraph, RAG (pgvector), evals e Langfuse"
readme = "README.md"
authors = [
    { name = "tiago.daniel", email = "tiagohdaniel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langfuse>=5.0.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
