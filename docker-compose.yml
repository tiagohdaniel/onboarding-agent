services:
  api:
    build: .
    # --reload: reinicia o servidor quando o código muda (só em desenvolvimento)
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"   # host:container — a 8000 do seu host já está ocupada
    env_file: .env
    environment:
      # Dentro da rede do compose, o banco se chama "db", não "localhost"
      DATABASE_URL: postgresql://onboarding:onboarding@db:5432/onboarding
    volumes:
      # Só app/ e tests/: o .venv do container não é sobrescrito pelo do host
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
